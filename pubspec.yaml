name: pdf_book_reader
description: Offline PDF book reader with highlights, bookmarks, saved words and progress.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  syncfusion_flutter_pdfviewer: ^34.1.30
  pdfx: ^2.11.0
  file_picker: ^13.3.2
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.2.0
  archive: ^4.7.1
  syncfusion_flutter_pdf: ^34.2.9
  syncfusion_flutter_core: ^34.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/book_icon.png

  fonts:
    - family: AbrilFatface
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
